<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0B0B0F;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .wrap {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
    }
    .logo {
      width: 96px; height: 72px;
      display: flex; align-items: center; justify-content: center;
      animation: pop 0.6s cubic-bezier(0.22, 1, 0.36, 1), float 3s ease-in-out infinite 0.6s;
    }
    .logo svg { width: 100%; height: 100%; }
    .name {
      height: 30px;
      opacity: 0;
      animation: fade 0.6s ease forwards 0.2s;
    }
    .name svg { height: 100%; width: auto; display: block; }
    .sub {
      color: #71717a;
      font-size: 12px;
      margin-top: -12px;
      opacity: 0;
      animation: fade 0.6s ease forwards 0.35s;
    }
    .bar {
      width: 160px; height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar::after {
      content: "";
      display: block;
      width: 40%; height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #7C5CFF, transparent);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes fade { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="wrap">

    </div>
